<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Dog peeking from the bottom-left with a big folded ear — line-art
       version of extension/assets/big_ear.png. currentColor keeps it
       themeable (VS Code masks Activity Bar icons to one color). -->
  <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- head: arc entering from the left edge, down to the bottom edge -->
    <path d="M0.8 13.8c2.2-1.6 4.7-2 6.9-1"/>
    <path d="M13.5 19.3c-.5 1.5-.7 3.1-.7 4.7"/>
    <!-- ear: outer edge up to the tip, folded flap, inner edge back to head -->
    <path d="M7.7 12.8 14 4.6a.9.9 0 0 1 1.3-.1l5.7 4.8a.9.9 0 0 1 .15 1.2l-3.4 4.9a.9.9 0 0 1-1.3.2"/>
    <path d="M14.6 4.2l1.9 10.8c.1.5-.1.9-.5 1.2l-2.5 3.1"/>
    <!-- inner ear shading (partial alpha survives the icon mask) -->
    <path d="M8.6 12.2 14.2 5l1.8 10-2.8 3.4z" fill="currentColor" stroke="none" opacity="0.4"/>
    <!-- face -->
    <circle cx="2.6" cy="17.4" r="1.1" fill="currentColor" stroke="none"/>
    <circle cx="8.4" cy="18.8" r="1.1" fill="currentColor" stroke="none"/>
    <path d="M3.9 20.3c.6-.5 1.5-.5 2.1 0 .2.6-.2 1.2-1 1.2s-1.3-.6-1.1-1.2Z" fill="currentColor" stroke="none"/>
    <path d="M5 21.5v.6m0 0c-.7.8-1.6.8-2.2.2m2.2-.2c.7.8 1.6.8 2.2.2"/>
  </g>
</svg>
